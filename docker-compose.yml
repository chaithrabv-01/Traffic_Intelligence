services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic_secure_password
      POSTGRES_DB: traffic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://traffic:traffic_secure_password@db:5432/traffic"
      DATA_DIR: "/app/data"
      JWT_SECRET: "urban_traffic_intelligence_super_secret_jwt_key_2026"
    volumes:
      - ./backend/data:/app/data
      - ./ml:/ml
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
